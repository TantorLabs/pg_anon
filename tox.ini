[tox]
# tox is installed standalone (`uv tool install tox` / `pipx install tox`).
requires = tox>=4
env_list = py311, py312, py313, py314
package = wheel
wheel_build_env = .pkg

# Dependencies come from the dev extra so they cannot drift from pyproject.
# Default envs run the packaging suite, the part worth checking on every interpreter.
[testenv]
description = Check the built distribution on {basepython}
extras = api, dev
commands = pytest -m packaging {posargs}

# Full suite against a live PostgreSQL: tox -e db-py311[,db-py312,...].
# Point it at a server with TEST_DB_* / TEST_CONFIG (tests/infrastructure/params.py).
[testenv:db-py3{11,12,13,14}]
description = Run the full test suite against a live PostgreSQL on {basepython}
extras = api, dev
passenv =
    TEST_*
    PG_ANON_HOME
    PGPASSWORD
# A -m here replaces the one in addopts, so "not stress" is repeated.
commands = pytest -m "not stress and not packaging" {posargs}

[testenv:stress]
description = Run the slow, timing-based stress suite against a live PostgreSQL
basepython = py311
extras = api, dev
passenv =
    TEST_*
    PG_ANON_HOME
    PGPASSWORD
commands = pytest -m stress {posargs}
